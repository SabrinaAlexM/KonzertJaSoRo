<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Errätst du unser Motto?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Shrikhand&family=Anton&family=Archivo+Narrow:wght@500;700&family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#06040a; --outside:#120b14;
  --gold:#f3d48a; --cream:#fff1d6; --orange:#e2532a; --maroon:#7a1c1c; --red:#e8483b; --white:#f4f4f4;
  --jg-green:#7BBB5D; --jg-black:#0D0D0D;
  color-scheme: dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --outside:#120b14; } }
:root[data-theme="dark"]{ --outside:#120b14; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; }
body{
  background:var(--outside); color:var(--cream); overflow:hidden;
  font-family:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  display:grid; place-items:center;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}

.story{
  position:relative; container-type:size; overflow:hidden; background:var(--stage);
  width:min(100vw, 56.25vh); height:min(100%, 177.8vw);
  touch-action:manipulation;
}
@media (min-width:700px){ .story{ border-radius:18px; height:min(94%, 177.8vw); width:min(100vw, 52.9vh); } }

/* Fortschritt */
.bars{ position:absolute; z-index:10; top:2.2cqh; left:3cqw; right:3cqw; display:flex; gap:1.2cqw; }
.bars span{ flex:1; height:max(3px, .45cqh); border-radius:2px; background:rgba(255,255,255,.3); overflow:hidden; }
.bars i{ display:block; height:100%; width:0; background:#fff; }
.bars span.done i{ width:100%; }
.bars span.run i{ animation:fill var(--dur,4s) linear forwards; }
.story.held .bars span.run i{ animation-play-state:paused; }
@keyframes fill{ to{ width:100%; } }

/* Folien */
.slide{
  position:absolute; inset:0; container-type:size; overflow:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  opacity:0; visibility:hidden; transition:opacity .7s ease, visibility 0s .7s;
}
.slide.active{ opacity:1; visibility:visible; transition:opacity .7s ease; }
.slide .in{ position:relative; z-index:2; opacity:0; transform:translateY(3cqh); transition:opacity .8s ease .25s, transform .9s cubic-bezier(.2,.7,.2,1) .25s; }
.slide.active .in{ opacity:1; transform:none; }
.slide .in.late{ transition-delay:.9s; }
.slide .in.later{ transition-delay:1.6s; }

/* Typo */
.word{ margin:0; line-height:1; white-space:nowrap; font-weight:400; font-size:min(16cqw, 11cqh); }
.dim{ font-family:"Archivo Narrow",Arial,sans-serif; font-weight:500; font-size:.5em; color:rgba(255,255,255,.55); }
.w-jazz{ font-family:"Limelight",Georgia,serif; color:var(--gold); text-shadow:0 0 .12em rgba(243,212,138,.55), 0 0 .5em rgba(243,212,138,.25); }
.w-soul{ font-family:"Shrikhand",Georgia,serif; color:var(--cream); text-shadow:.035em .035em 0 var(--orange), .07em .07em 0 var(--maroon); }
.w-rock{ font-family:"Anton",Impact,sans-serif; font-size:1.18em; color:var(--white); text-shadow:.03em 0 0 var(--red), -.02em 0 0 rgba(80,160,255,.5); }
.q{ display:inline-block; margin-left:.04em; animation:bob 1.6s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) rotate(0); } 50%{ transform:translateY(-.06em) rotate(8deg); } }

/* Folie 1 */
.s-intro{ background:radial-gradient(ellipse at 50% 40%, #2b1530 0%, #0e0812 70%); padding:0 9cqw; }
.s-intro .lead{ margin:0; font:700 min(9.5cqw, 6cqh)/1.12 "Archivo Narrow",Arial,sans-serif; color:var(--cream); text-wrap:balance; }
.s-intro .mix{ margin:6cqh 0 0; font-size:min(12cqw, 8cqh); line-height:1; }
.s-intro .mix span{ display:inline-block; }
.s-intro .mix span:nth-child(1){ animation:pop 2.4s ease-in-out infinite; }
.s-intro .mix span:nth-child(2){ animation:pop 2.4s ease-in-out .8s infinite; }
.s-intro .mix span:nth-child(3){ animation:pop 2.4s ease-in-out 1.6s infinite; }
@keyframes pop{ 0%,60%,100%{ transform:scale(1); opacity:.55; } 25%{ transform:scale(1.18); opacity:1; } }
.s-intro .hint{ margin:7cqh 0 0; font-size:min(4.2cqw, 2.6cqh); font-weight:500; color:rgba(255,241,214,.6); }

/* Welten */
.world{ position:absolute; inset:0; overflow:hidden; container-type:size; }
.jazz{ background:radial-gradient(ellipse at 50% 115%, #23397a 0%, #0c1636 55%, #050817 100%); }
.jazz .beam{
  position:absolute; top:-8%; left:50%; width:110cqmin; height:125%; margin-left:-55cqmin;
  clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);
  background:linear-gradient(180deg, rgba(255,226,160,.38), rgba(255,226,160,0) 85%);
  filter:blur(6px); transform-origin:50% 0; animation:sway 9s ease-in-out infinite alternate;
}
.jazz .smoke{ position:absolute; border-radius:50%; background:radial-gradient(circle, rgba(170,190,255,.18), transparent 65%); filter:blur(28px); animation:drift 18s ease-in-out infinite alternate; }
.jazz .s1{ width:140cqmin; height:80cqmin; left:-30%; bottom:4%; }
.jazz .s2{ width:110cqmin; height:60cqmin; right:-35%; bottom:30%; animation-direction:alternate-reverse; }
@keyframes sway{ from{ transform:rotate(-16deg); } to{ transform:rotate(16deg); } }
@keyframes drift{ from{ transform:translate(-8%,0); } to{ transform:translate(10%,-6%); } }

.soul{ background:linear-gradient(180deg, #2a0712 0%, #7a1c1c 40%, #d9541e 72%, #f5a524 100%); }
.soul .rays{
  position:absolute; left:50%; bottom:0; width:260cqmax; height:260cqmax; margin-left:-130cqmax; margin-bottom:-130cqmax;
  background:repeating-conic-gradient(from 0deg, rgba(255,214,150,.1) 0 5deg, transparent 5deg 12deg);
  border-radius:50%; animation:turn 80s linear infinite;
}
.soul .sun{
  --d:min(92cqw, 60cqh);
  position:absolute; left:50%; bottom:calc(var(--d) / -2); width:var(--d); height:var(--d); margin-left:calc(var(--d) / -2); border-radius:50%;
  background:radial-gradient(circle at 50% 30%, #ffe08a, #ffb347 45%, #ff7b2c 80%, #e0402b);
  box-shadow:0 0 14cqmin rgba(255,170,60,.5); animation:breathe 6s ease-in-out infinite alternate;
}
@keyframes turn{ to{ rotate:360deg; } }
@keyframes breathe{ from{ transform:translateY(4cqmin) scale(.98); } to{ transform:none; } }

.rock{ background:radial-gradient(ellipse at 50% 0%, #4a0d10 0%, #1a0608 45%, #0a0405 100%); }
.rock .lights i{
  position:absolute; top:-6%; width:22cqw; height:120%; margin-left:-11cqw;
  clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);
  background:linear-gradient(180deg, rgba(255,90,70,.55), rgba(255,90,70,0) 75%);
  transform-origin:50% 0; animation:sweep 2.8s ease-in-out infinite alternate, flash 3.6s steps(1) infinite;
}
.rock .lights i:nth-child(1){ left:18%; }
.rock .lights i:nth-child(2){ left:50%; background:linear-gradient(180deg, rgba(255,255,255,.45), transparent 70%); animation-delay:-1.1s,1.3s; animation-direction:alternate-reverse,normal; }
.rock .lights i:nth-child(3){ left:82%; animation-delay:-2s,2.2s; }
.rock .grain{
  position:absolute; inset:-50%; opacity:.22; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation:grain .6s steps(3) infinite;
}
@keyframes sweep{ from{ transform:rotate(-24deg); } to{ transform:rotate(24deg); } }
@keyframes flash{ 0%,100%{ opacity:1; } 6%{ opacity:.25; } 9%{ opacity:1; } 52%{ opacity:.5; } 55%{ opacity:1; } }
@keyframes grain{ 0%{ transform:translate(0,0); } 33%{ transform:translate(-4%,3%); } 66%{ transform:translate(3%,-4%); } }

/* Auflösung: animiert in JaSoRo-Grün und Schwarz */
.s-reveal{ background:var(--jg-black); }
.bands{ position:absolute; inset:-5% -45%; display:grid; grid-template-columns:repeat(3,1fr); gap:1.5cqw; transform:skewX(-12deg); }
.bands > div{ position:relative; overflow:hidden; transform:translateY(100%); transition:transform 1.2s cubic-bezier(.2,.7,.2,1); }
.bands > div:nth-child(2){ transform:translateY(-100%); }
.s-reveal.active .bands > div{ transform:none; }
.s-reveal.active .bands > div:nth-child(2){ transition-delay:.15s; }
.s-reveal.active .bands > div:nth-child(3){ transition-delay:.3s; }
.mono.jazz,.mono.soul,.mono.rock{ background:var(--jg-black); }
.mono.jazz .beam{ background:linear-gradient(180deg, rgba(123,187,93,.5), rgba(123,187,93,0) 85%); }
.mono.jazz .smoke{ background:radial-gradient(circle, rgba(123,187,93,.18), transparent 65%); }
.mono.soul .rays{ background:repeating-conic-gradient(from 0deg, rgba(123,187,93,.12) 0 5deg, transparent 5deg 12deg); }
.mono.soul .sun{ background:radial-gradient(circle at 50% 30%, #b5e39c, var(--jg-green) 55%, #4e8a37); box-shadow:0 0 14cqmin rgba(123,187,93,.45); }
.mono.rock .lights i,.mono.rock .lights i:nth-child(2){ background:linear-gradient(180deg, rgba(123,187,93,.6), rgba(123,187,93,0) 75%); }
.s-reveal .veil{ position:absolute; inset:0; z-index:1; background:radial-gradient(ellipse at 50% 48%, rgba(13,13,13,.85) 0%, rgba(13,13,13,.45) 60%, rgba(13,13,13,.6) 100%); }
.s-reveal .word{ font-size:min(26cqw, 16cqh); }
.g-jazz{ font-family:"Limelight",Georgia,serif; color:var(--jg-green); text-shadow:0 0 .12em rgba(123,187,93,.6); }
.g-soul{ font-family:"Shrikhand",Georgia,serif; color:var(--jg-green); text-shadow:.04em .04em 0 #2f5a22; }
.g-rock{ font-family:"Anton",Impact,sans-serif; font-size:1.18em; color:var(--jg-green); text-shadow:.03em .03em 0 #2f5a22; }
.s-reveal .kicker{ margin:0 0 2.5cqh; font:700 min(5cqw, 3cqh) "Archivo Narrow",Arial,sans-serif; color:rgba(255,255,255,.8); letter-spacing:.03em; }
.s-reveal .styles{ margin:2.5cqh 0 0; font:700 min(5.4cqw, 3.4cqh) "Archivo Narrow",Arial,sans-serif; color:#fff; }
.s-reveal .date{
  margin:6cqh 7cqw 0; padding:2.4cqh 5cqw; border-radius:2cqh;
  background:rgba(13,13,13,.7); border:2px solid var(--jg-green);
  font:500 min(5cqw, 3.1cqh)/1.3 "Archivo Narrow",Arial,sans-serif; color:#fff;
}
.s-reveal .date b{ display:block; font-weight:700; font-size:1.35em; margin-top:.4cqh; color:var(--jg-green); }
.replay{
  margin-top:4cqh; min-height:44px; padding:0 6cqw; border-radius:999px; cursor:pointer;
  font:700 min(4.4cqw, 2.8cqh) "Archivo Narrow",Arial,sans-serif;
  color:var(--jg-black); background:var(--jg-green); border:0;
}
.replay:focus-visible{ outline:2px solid var(--gold); outline-offset:3px; }

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01s !important; animation-iteration-count:1 !important; }
  .bars span.run i{ animation-duration:var(--dur,4s) !important; }
  .slide,.slide .in,.bands > div{ transition-duration:.01s !important; transition-delay:0s !important; }
}
</style>
</head>
<body>
<main class="story" id="story" aria-label="Motto-Teaser, tippen zum Weiterblättern">
  <div class="bars" id="bars"></div>

  <section class="slide s-intro active" data-dur="6000">
    <p class="lead in">Errätst du unser Motto fürs nächste Konzert?</p>
    <p class="mix in late" aria-hidden="true"><span class="w-jazz">Ja</span><span class="w-soul">So</span><span class="w-rock">Ro</span><span class="dim q">?</span></p>
  </section>

  <section class="slide" data-dur="4800">
    <div class="world jazz"><div class="beam"></div><div class="smoke s1"></div><div class="smoke s2"></div></div>
    <h2 class="word in"><span class="w-jazz">Jazz</span><span class="dim">SoRo</span><span class="w-jazz q">?</span></h2>
  </section>

  <section class="slide" data-dur="4800">
    <div class="world soul"><div class="rays"></div><div class="sun"></div></div>
    <h2 class="word in"><span class="dim">Ja</span><span class="w-soul">Soul</span><span class="dim">Ro</span><span class="w-soul q">?</span></h2>
  </section>

  <section class="slide" data-dur="4800">
    <div class="world rock"><div class="lights"><i></i><i></i><i></i></div><div class="grain"></div></div>
    <h2 class="word in"><span class="dim">JaSo</span><span class="w-rock">Rock</span><span class="w-rock q">?</span></h2>
  </section>

  <section class="slide s-reveal" data-dur="0">
    <div class="bands" aria-hidden="true">
      <div><div class="world jazz mono"><div class="beam"></div><div class="smoke s1"></div></div></div>
      <div><div class="world soul mono"><div class="rays"></div><div class="sun"></div></div></div>
      <div><div class="world rock mono"><div class="lights"><i></i><i></i><i></i></div><div class="grain"></div></div></div>
    </div>
    <div class="veil"></div>
    <p class="kicker in">Unser Motto</p>
    <h1 class="word in late"><span class="g-jazz">Ja</span><span class="g-soul">So</span><span class="g-rock">Ro</span></h1>
    <p class="styles in late">Jazz. Soul. Rock.</p>
    <p class="date in later">Wir freuen uns aufs Konzertwochenende<b>18. und 19. September 2027</b></p>
    <button class="replay in later" id="replay" type="button">Nochmals ansehen</button>
  </section>
</main>

<script>
const story = document.getElementById("story");
const slides = [...document.querySelectorAll(".slide")];
const bars = document.getElementById("bars");
slides.forEach(() => { const s = document.createElement("span"); s.appendChild(document.createElement("i")); bars.appendChild(s); });
const barEls = [...bars.children];

let cur = 0, timer = null, started = 0, remaining = 0, holding = false;

function setBars(){
  barEls.forEach((b, i) => {
    b.classList.remove("run", "done");
    const inner = b.firstChild; inner.style.animation = "none"; void inner.offsetWidth; inner.style.animation = "";
    if (i < cur) b.classList.add("done");
  });
  const dur = Number(slides[cur].dataset.dur);
  if (dur > 0){ barEls[cur].style.setProperty("--dur", dur + "ms"); barEls[cur].classList.add("run"); }
  else barEls[cur].classList.add("done");
}
function schedule(ms){
  clearTimeout(timer);
  remaining = ms; started = Date.now();
  if (ms > 0) timer = setTimeout(() => go(cur + 1), ms);
}
function go(n){
  if (n < 0) n = 0;
  if (n >= slides.length) return;
  slides[cur].classList.remove("active");
  cur = n;
  slides[cur].classList.add("active");
  setBars();
  schedule(Number(slides[cur].dataset.dur));
}

// Tippen: rechts weiter, links zurück, gedrückt halten pausiert
let downAt = 0, holdT = null;
story.addEventListener("pointerdown", e => {
  if (e.target.closest("button")) return;
  downAt = Date.now();
  holdT = setTimeout(() => {
    holding = true; story.classList.add("held");
    clearTimeout(timer); remaining -= Date.now() - started;
  }, 220);
});
story.addEventListener("pointerup", e => {
  if (e.target.closest("button")) return;
  clearTimeout(holdT);
  if (holding){
    holding = false; story.classList.remove("held");
    if (Number(slides[cur].dataset.dur) > 0) schedule(Math.max(remaining, 300));
    return;
  }
  const r = story.getBoundingClientRect();
  if (e.clientX - r.left < r.width / 3) go(cur - 1); else go(cur + 1);
});
story.addEventListener("pointercancel", () => { clearTimeout(holdT); if (holding){ holding = false; story.classList.remove("held"); schedule(Math.max(remaining, 300)); } });
story.addEventListener("contextmenu", e => e.preventDefault());

document.getElementById("replay").addEventListener("click", () => go(0));
document.addEventListener("keydown", e => {
  if (["ArrowRight"," ","PageDown"].includes(e.key)){ e.preventDefault(); go(cur + 1); }
  if (["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); go(cur - 1); }
});

setBars(); schedule(Number(slides[0].dataset.dur));
</script>
</body>
</html>
